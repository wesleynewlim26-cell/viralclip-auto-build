name: Build and Sign APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install apksigner
        run: |
          sudo apt-get update && sudo apt-get install -y apksigner


      - name: Convert Java libs (OkHttp & Gson) to DEX
        run: |
          # Ensure Android build-tools are installed (default on ubuntu-latest)
          sudo apt-get update && sudo apt-get install -y build-essential openjdk-11-jdk
          # Use d8 (part of Android Build Tools) to convert JARs to DEX and merge into a single classes.dex
          mkdir -p libs && cp libs/*.jar . || true
          if ls *.jar 1> /dev/null 2>&1; then
            d8 --output=classes.dex *.jar
            # Inject the generated classes.dex into the unsigned APK
            zip -u unsigned.apk classes.dex
          else
            echo "No external JARs found, skipping DEX conversion."
          fi

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-key-alias debug --ks-pass pass:android --key-pass pass:android --out signed.apk unsigned.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: signed.apk
