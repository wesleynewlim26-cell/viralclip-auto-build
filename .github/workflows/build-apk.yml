name: Build and Sign APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Apktool
        run: |
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo mv apktool.jar /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool.jar
          echo -e "#!/usr/bin/env sh\njava -jar /usr/local/bin/apktool.jar \$@" | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

      - name: Build APK with Apktool
        run: |
          apktool b . -o unsigned.apk

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-key-alias debug --ks-pass pass:android --key-pass pass:android --out signed.apk unsigned.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: signed.apk
