name: Rescue Build Debug16
on:
  push:
    branches: [ 'rescue/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Install Apktool & Build-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner android-sdk-build-tools

      - name: Build APK
        run: |
          apktool b . -o unsigned.apk --use-aapt2 /usr/bin/aapt2

      - name: Create debug keystore
        run: |
          keytool -genkeypair -alias debug -keyalg RSA -keysize 2048 -validity 10000 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-key-alias debug --ks-pass pass:android --key-pass pass:android --out viralclip-debug16.apk unsigned.apk

      - name: Verify APK
        run: |
          apksigner verify --verbose viralclip-debug16.apk
          ls -lh viralclip-debug16.apk

      - name: Upload viralclip-debug16 artifact
        uses: actions/upload-artifact@v4
        with:
          name: viralclip-debug16
          path: viralclip-debug16.apk
