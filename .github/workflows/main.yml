name: Build & Sign APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp
      - name: Ensure assets folder
        run: |
          mkdir -p assets

      - name: Download sample video with yt-dlp
        run: |
          yt-dlp -f bestvideo+bestaudio -o assets/sample_video.mp4 "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

          
      - name: Install Apktool & Build-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner android-sdk-build-tools
          
      - name: Build APK
        run: |
          # Build APK including assets folder (yt-dlp downloaded video)
          apktool b . -o unsigned.apk --use-aapt2 /usr/bin/aapt2

      - name: Create debug keystore
        run: |
          keytool -genkeypair -alias debug -keyalg RSA -keysize 2048 -validity 10000 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          
      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-key-alias debug --ks-pass pass:android --key-pass pass:android --out viralclip_fixed_signed.apk unsigned.apk
          
