name: Rescue Build Debug2
on:
  push:
    branches: [ 'rescue/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android Build Tools
        run: |
          sudo -S -p '' apt-get update && sudo -S -p '' apt-get install -y apktool apksigner android-sdk-build-tools

      - name: Build APK
        run: |
          apktool b . -o unsigned.apk --use-aapt2 /usr/bin/aapt2

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-key-alias debug --ks-pass pass:android --key-pass pass:android --out viralclip-debug2.apk unsigned.apk

      - name: Verify APK
        run: |
          apksigner verify --verbose viralclip-debug2.apk
          ls -lh viralclip-debug2.apk

      - name: Upload viralclip-debug2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: viralclip-debug2
          path: viralclip-debug2.apk
