name: Build and Sign APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y android-sdk-build-tools

        run: |
          sudo apt-get update && sudo apt-get install -y apksigner


      - name: Compile Java utils (OkHttp, Gson, YouTubeExtractor) to DEX
        run: |
          # Install JDK and Android build tools (already present via setup-java)
          mkdir -p java_build
          # Compile all Java source files (including YouTubeExtractor) to .class
          find src/java -name "*.java" > sources.txt
          javac -d java_build @sources.txt
          # Convert compiled classes and any JAR libs in libs/ to a single dex file using d8
          d8 --output=combined.dex $(find java_build -name "*.class") $(find libs -name "*.jar" || true)
          # Place the dex so apktool can include it (will be merged into classes.dex automatically)
          cp combined.dex .


      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-key-alias debug --ks-pass pass:android --key-pass pass:android --out signed.apk unsigned.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: signed.apk
