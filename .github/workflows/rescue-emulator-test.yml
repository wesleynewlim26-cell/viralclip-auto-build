name: Rescue Emulator Test Debug4
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/debug2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade yt-dlp

      - name: Install Apktool & Build-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner android-sdk-build-tools

      - name: Build APK
        run: |
          apktool b . -o unsigned.apk --use-aapt2 /usr/bin/aapt2

      - name: Create debug keystore
        run: |
          keytool -genkeypair -alias debug -keyalg RSA -keysize 2048 -validity 10000 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          apksigner sign --ks debug.keystore --ks-key-alias debug --ks-pass pass:android --key-pass pass:android --out viralclip-debug4.apk unsigned.apk

      - name: Verify APK
        run: |
          apksigner verify --verbose viralclip-debug4.apk
          ls -lh viralclip-debug4.apk

      - name: Upload viralclip-debug4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: viralclip-debug4
          path: viralclip-debug4.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: viralclip-debug4
          path: ./apk

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run emulator + logcat capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 4096 -cores 2
          disable-animations: true
          script: |
            ls -lh apk/viralclip-debug4.apk
            echo "--- wait boot sabar ---"
            adb wait-for-device
            BOOT=""
            i=0
            for i in $(seq 1 240); do
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              [ "$BOOT" = "1" ] && break
              sleep 5
            done
            echo "boot_completed=$BOOT setelah ~$((i*5)) detik"
            if adb shell pm list packages >/dev/null 2>&1; then echo SERVICES_OK; SERVICES=1; else echo SERVICES_MISSING; SERVICES=0; fi
            if [ "$SERVICES" != "1" ]; then
              echo "SKIP_INSTALL_SERVICES_DOWN"
              echo "SERVICES_DOWN_NO_INSTALL" > logcat_live.txt
              exit 0
            fi
            echo "--- retry install 3x jeda 20s ---"
            for i in 1 2 3; do echo "install attempt $i"; adb install -r apk/viralclip-debug4.apk && break; echo "install failed, waiting 20s"; sleep 20; done
            adb logcat -c
            adb logcat -v time > logcat_live.txt &
            LOGPID=$!
            echo "logcat pid=$LOGPID"
            adb shell am start -n id.wealthstock.viralclip/.MainActivity
            sleep 20
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml ui.xml || true
            cat ui.xml || echo "UI_XML_MISSING"
            COORD=$(python3 - <<'PY'
            import re
            try:
                xml=open('ui.xml',encoding='utf-8',errors='ignore').read()
            except Exception:
                xml=""
            pats=[r'text="[^"]*DEBUG-4[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',
                  r'text="[^"]*BUAT KLIP[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',
                  r'text="[^"]*MEMPROSES[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"']
            for pat in pats:
                m=re.search(pat,xml)
                if m:
                    x1,y1,x2,y2=map(int,m.groups());print((x1+x2)//2,(y1+y2)//2);break
            PY
            )
            echo "COORD=$COORD"
            if [ -z "$COORD" ]; then
              echo "COORD_NOT_FOUND"
            else
              adb shell input tap $COORD
            fi
            sleep 90
            adb shell uiautomator dump /sdcard/ui2.xml || true
            adb pull /sdcard/ui2.xml ui2.xml || true
            cat ui2.xml || echo "UI2_XML_MISSING"
            adb exec-out screencap -p > screen.png || true
            ls -lh screen.png ui.xml ui2.xml logcat_live.txt || true
            kill $LOGPID || true
            sleep 2
            echo "--- logcat tail ---"
            tail -n 300 logcat_live.txt || true
            echo "--- FILTER ---"
            grep -i "FATAL\|VC-RESCUE\|AndroidRuntime\|ffmpeg\|yt-dlp\|ClipPipeline" logcat_live.txt | head -n 300 || true

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-debug4
          path: |
            logcat_live.txt
            ui.xml
            ui2.xml
            screen.png
